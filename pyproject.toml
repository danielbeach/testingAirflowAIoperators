[project]
name = "testing-airflow-ai-operators"
version = "0.1.0"
description = "Example DAGs for the Apache Airflow Common AI provider (LLM operators), run locally with Astro CLI."
requires-python = ">=3.12"
dependencies = [
    "apache-airflow>=3.1",
    "apache-airflow-providers-common-ai[anthropic,openai,parquet,sql]>=0.10.0",
    "apache-airflow-providers-common-sql>=2.2.0",
    "apache-airflow-providers-postgres>=7.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["airflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
